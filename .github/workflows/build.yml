name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  electron:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeChat-Electron
          path: electron/release/*.exe

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish native -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeChat-Native
          path: publish/ClaudeChat.Native.exe
